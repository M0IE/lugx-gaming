<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <title>Lugx Gaming - Mi Biblioteca</title>

  <!-- Bootstrap core CSS -->
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <!-- Additional CSS Files -->
  <link rel="stylesheet" href="assets/css/fontawesome.css">
  <link rel="stylesheet" href="assets/css/templatemo-lugx-gaming.css">
  <link rel="stylesheet" href="assets/css/owl.css">
  <link rel="stylesheet" href="assets/css/animate.css">
  <link rel="stylesheet" href="https://unpkg.com/swiper@7/swiper-bundle.min.css" />
  <style>
    .library-item {
      background-color: #121216;  /* Cambiado de #f7f7f7 a #121216 */
      border-radius: 25px;
      overflow: hidden;
      margin-bottom: 30px;
      transition: all 0.3s;
    }
    
    .library-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    
    .library-item .game-image {
      position: relative;
      overflow: hidden;
      border-radius: 25px 25px 0 0;
      height: 200px;
    }
    
    .library-item .game-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .library-item .game-info {
      padding: 20px;
      background-color: #232327;  /* Agregado color de fondo similar al de los juegos en shop */
    }
    
    .library-item .game-info h4 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #fff;  /* Cambiado para mejor contraste */
    }
    
    .library-item .game-info .category {
      color: #7a7a7a;
      font-size: 14px;
      margin-bottom: 15px;
      display: block;
    }
    
    .library-item .game-info .purchase-date {
      color: #0071f8;
      font-size: 14px;
      margin-bottom: 20px;
      display: block;
    }
    
    .download-button {
      display: inline-block;
      background-color: #343437;  /* Cambiado para usar el gris de Epic */
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 25px;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    
    .download-button:hover {
      background-color: #0071f8;
      color: #fff;
    }
    
    .download-button i {
      margin-right: 8px;
    }
    
    .empty-library {
      text-align: center;
      padding: 50px 0;
    }
    
    .empty-library h3 {
      margin-bottom: 20px;
      color: #fff;  /* Cambiado para mejor contraste */
    }

    .empty-library p {
      color: #7a7a7a;  /* Agregado para mejor legibilidad */
    }
  </style>
</head>

<body>

  <!-- ***** Preloader Start ***** -->
  <div id="js-preloader" class="js-preloader">
    <div class="preloader-inner">
      <span class="dot"></span>
      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
  <!-- ***** Preloader End ***** -->

  <!-- ***** Header Area Start ***** -->
  <header class="header-area header-sticky">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <nav class="main-nav">
            <!-- ***** Logo Start ***** -->
            <a href="index.html" class="logo">
              <img src="assets/images/logo.png" alt="" style="width: 158px;">
            </a>
            <!-- ***** Logo End ***** -->
            <!-- ***** Menu Start ***** -->
            <ul class="nav">
              <li><a href="index.html" class="active">Home</a></li>
              <li><a href="shop.html">Tienda</a></li>
              
              <li><a href="contact.html">Contacto</a></li>
              <li id="login-link"><a href="login.html">Iniciar sesión</a></li>
              <li><a href="cart.html"><i class="fa fa-shopping-cart"></i> <span id="cart-count">0</span></a></li>
              <li><a href="library.html"><i class="fa fa-gamepad"></i> Mi Biblioteca</a></li>
            </ul>
            <a class='menu-trigger'>
              <span>Menu</span>
            </a>
            <!-- ***** Menu End ***** -->
          </nav>
        </div>
      </div>
    </div>
  </header>
  <!-- ***** Header Area End ***** -->

  <div class="page-heading header-text">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h3>Mi Biblioteca de Juegos</h3>
          <span class="breadcrumb"><a href="index.html">Home</a> > Mi Biblioteca</span>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="container">
      <div id="empty-library" class="empty-library" style="display: none;">
        <h3>Tu biblioteca está vacía</h3>
        <p>Aún no has comprado ningún juego. Explora nuestra tienda para encontrar los mejores títulos.</p>
        <div class="main-button mt-4">
          <a href="shop.html">Ir a la tienda</a>
        </div>
      </div>
      
      <div id="library-container" class="row">
        <!-- Los juegos comprados se cargarán aquí dinámicamente -->
      </div>
    </div>
  </div>

 

  <!-- Scripts -->
  <!-- Bootstrap core JavaScript -->
  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.min.js"></script>
  <script src="assets/js/isotope.min.js"></script>
  <script src="assets/js/owl-carousel.js"></script>
  <script src="assets/js/counter.js"></script>
  <script src="assets/js/custom.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/library.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const username = localStorage.getItem('username');
        if (username) {
            const loginLink = document.getElementById('login-link');
            loginLink.innerHTML = `<a href="account.html" class="nav-link" style="color: #0071f8;">${username}</a>`; // Reemplazar el texto y agregar el enlace
        }
    });
</script>

</body>
</html>
